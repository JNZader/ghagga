name: 'GHAGGA Code Review'
description: >-
  AI-powered multi-agent code review for PRs with built-in static analysis.
  Runs 16 static analysis tools directly on the GitHub Actions runner (cached).
  3 provider modes: gateway (mcp-llm-bridge), cli-bridge (local CLIs), ollama.

branding:
  icon: 'eye'
  color: 'purple'

inputs:
  provider:
    description: >-
      LLM provider to use. Options: gateway (default — route via mcp-llm-bridge),
      cli-bridge (local CLI tools: Claude Code, OpenCode, Copilot), ollama (local).
      Legacy values (github, anthropic, openai, google, etc.) are automatically
      remapped to "gateway" for backward compatibility.
    required: false
    default: 'gateway'

  model:
    description: >-
      LLM model identifier. For gateway/cli-bridge, use "auto" to let the
      provider select the best available model.
    required: false

  mode:
    description: >-
      Review mode. "simple" = single LLM call, "workflow" = 5 specialist agents,
      "consensus" = for/against/neutral voting.
    required: false
    default: 'simple'

  api-key:
    description: >-
      LLM provider credential. For gateway: bearer token. For cli-bridge: tool
      API key (optional). For ollama: not required.
    required: false

  github-token:
    description: >-
      GitHub token for fetching PR diffs and posting comments.
      Defaults to the automatic GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}

  enabled-tools:
    description: >-
      Comma-separated list of tool names to force-enable (overrides auto-detect).
      Example: "ruff,clippy,bandit". See README for the full list of 16 tools.
    required: false
    default: ''

  disabled-tools:
    description: >-
      Comma-separated list of tool names to force-disable (overrides always-on and auto-detect).
      Example: "gitleaks,cpd". See README for the full list of 16 tools.
    required: false
    default: ''

  enable-semgrep:
    description: >-
      [DEPRECATED — use disabled-tools instead]
      Enable Semgrep security analysis. Runs directly on the runner.
      First run installs via pip (~2 min), subsequent runs use cache (~10s).
    required: false
    default: 'true'

  enable-trivy:
    description: >-
      [DEPRECATED — use disabled-tools instead]
      Enable Trivy vulnerability scanning. Runs directly on the runner.
      First run installs via official script (~1 min), subsequent runs use cache (~5s).
    required: false
    default: 'true'

  enable-cpd:
    description: >-
      [DEPRECATED — use disabled-tools instead]
      Enable PMD/CPD copy-paste detection. Runs directly on the runner.
      First run downloads PMD (~1 min), subsequent runs use cache (~5s).
    required: false
    default: 'true'

  enable-memory:
    description: >-
      Enable review memory. Caches observations between runs via @actions/cache.
      Set to 'false' to disable.
    required: false
    default: 'true'

outputs:
  status:
    description: 'Review status: PASSED, FAILED, NEEDS_HUMAN_REVIEW, or SKIPPED'
  findings-count:
    description: 'Number of findings from the review'

runs:
  using: 'node24'
  main: 'apps/action/dist/index.js'
