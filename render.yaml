# =============================================================================
# LEGACY: Render Blueprint -- GHAGGA Server
# =============================================================================
# NOTE: GHAGGA has migrated to self-hosted deployment via Coolify on Hetzner.
# This file is kept for reference only. The recommended deployment method is
# documented in docs/deployment.md.
#
# If you still want to deploy on Render, you will also need a Redis add-on
# or external Redis instance for BullMQ job processing.
# =============================================================================
# Docs: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: ghagga
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerfilePath: apps/server/Dockerfile
    dockerContext: .
    watchPaths:
      - apps/server/**
      - packages/core/**
      - packages/db/**
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - render.yaml
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: WORKER_CONCURRENCY
        value: "3"
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: "production"
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: STATE_SECRET
        sync: false
