packages:
  - "packages/*"
  - "apps/*"

# pnpm 11 default is 1440 (1 day). That rejects packages already on main
# from #423/#424 (turbo 2.11.4, ai 7.0.114, vite 8.3.1). Dependabot already
# holds 5 days. Revisit enabling the age gate after those releases age.
minimumReleaseAge: 0

# pnpm 11: no dependency lifecycle scripts. Same posture as
# pnpm 10 onlyBuiltDependencies: [] + ignoredBuiltDependencies.
allowBuilds:
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false

overrides:
  undici: ">=7.28.0 <8"
  "esbuild@<=0.24.2": ">=0.25.0"
  "hono@<4.12.7": ">=4.12.7"
  "fast-xml-parser@>=4.0.0-beta.3 <=5.5.5": ">=5.5.6"
  "lodash-es@<4.18.0": ">=4.18.0"
  "qs@>=6.0.0 <6.15.2": ">=6.15.2"
  "js-yaml@>=3.0.0 <3.15.0": ">=3.15.0 <4"
  "@babel/core@>=7.0.0 <7.29.6": ">=7.29.6 <8"
