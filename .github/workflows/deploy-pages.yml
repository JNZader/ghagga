# ============================================
# GHAGGA v2 — Deploy to GitHub Pages
# ============================================
# Assembles landing page + React dashboard + Docsify docs
# into a single GitHub Pages deployment.
#
# Final URL structure:
#   /              → Landing page (static HTML)
#   /app/          → Dashboard (React SPA)
#   /docs/         → Documentation (Docsify)

name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - 'docs/**'
      - 'landing/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: # Manual trigger from GitHub Actions UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build & Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        run: pnpm exec turbo build --filter=@ghagga/dashboard
        env:
          VITE_API_URL: ${{ vars.API_URL || 'https://api.javierzader.com' }}

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp landing/index.html _site/
          cp landing/favicon.svg _site/
          cp -r apps/dashboard/dist _site/app
          cp -r docs _site/docs
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
