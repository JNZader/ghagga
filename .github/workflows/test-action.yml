# Live GHAGGA Action review on pull requests, using Groq.
#
# `provider: groq` calls https://api.groq.com/openai/v1 chat completions with
# `api-key`. A Groq error fails this job (the Action calls setFailed). Fork
# PRs do not receive repository secrets, so the review steps are skipped and
# the job stays green.
name: Test GHAGGA Action

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip live review on fork PRs
        if: github.event.pull_request.head.repo.fork == true
        run: |
          echo "Fork PR: GROQ_API_KEY is unavailable. Skipping the live Groq review."

      - name: Checkout
        if: github.event.pull_request.head.repo.fork == false
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run GHAGGA Review
        if: github.event.pull_request.head.repo.fork == false
        uses: ./
        with:
          provider: groq
          model: openai/gpt-oss-120b
          mode: simple
          api-key: ${{ secrets.GROQ_API_KEY }}
          github-token: ${{ github.token }}
