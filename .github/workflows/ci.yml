name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard - Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  edge-functions:
    name: Edge Functions - Deno Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Check formatting
        run: deno fmt --check supabase/functions/

      - name: Lint
        run: deno lint supabase/functions/

      - name: Run tests
        run: deno test supabase/functions/ --allow-env --allow-net --import-map=supabase/functions/import_map.json
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: test-key
          SUPABASE_SERVICE_ROLE_KEY: test-key

  semgrep-service:
    name: Semgrep Service - Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: semgrep-service

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: python -m pytest test_main.py -v
