# ============================================
# GHAGGA — CI Pipeline
# ============================================
# Runs on PRs to main (fast gate) and on pushes to main (+ coverage).
# Path-filtered: doc-only changes skip the heavy jobs.
# Setup (pnpm + Node + install) is centralized in .github/actions/setup.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  # ── Detect Changes ─────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'templates/**'
              - 'action.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'biome.json'
              - 'tsconfig*.json'
              - '.npmrc'
              - 'docker-compose.yml'
              - '.dockerignore'
              - 'render.yaml'
              - '.github/workflows/**'
              - '.github/actions/**'

  # ── Security Scanning (advisory) ───────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Audit production dependencies (OSV)
        run: |
          # npm retired the endpoint pnpm audit uses (HTTP 410 on
          # /-/npm/v1/security/audits, pnpm 9.x never migrated to the bulk
          # endpoint), so `pnpm audit` fails unconditionally. Use OSV.dev, which
          # scans the pnpm lockfile directly. Advisory-only (job is
          # continue-on-error): findings are surfaced, never block the merge.
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64"
          chmod +x osv-scanner
          ./osv-scanner --lockfile=pnpm-lock.yaml \
            || echo "::warning::OSV advisories found (advisory-only, non-blocking) — review the report above and address separately"

  # ── Typecheck & Build ──────────────────────────────────────
  check:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Typecheck all packages
        run: pnpm exec turbo typecheck
      - name: Build all packages
        run: pnpm exec turbo build

  # ── Lint ───────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint

  # ── Tests + Coverage (PR gate + main push) ─────────────────
  # PRODOPS-009: coverage now runs (and its per-package thresholds are enforced,
  # see apps/*/vitest.config.ts and packages/*/vitest.config.ts) on every PR, not
  # just after merge — a regression is caught before it lands, not after. This
  # replaces the previous split of a coverage-less "Tests" job on PRs and a
  # separate "Tests + Coverage" job on push: running turbo once with coverage
  # covers both cases without doubling the test run per event.
  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run tests with coverage
        run: pnpm exec turbo test:coverage
        env:
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      # Coverage HTML/JSON reports are only archived on push to main (not on every
      # PR run) to avoid piling up artifact storage for runs that are superseded
      # by the next commit anyway; the threshold gate above already ran for PRs.
      - name: Upload coverage reports
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
            apps/*/coverage/
          retention-days: 7
          if-no-files-found: ignore
