# ============================================
# GHAGGA — CI Pipeline
# ============================================
# Runs on PRs to main (fast gate) and on pushes to main (+ coverage).
# Path-filtered: doc-only changes skip the heavy jobs.
# Setup (pnpm + Node + install) is centralized in .github/actions/setup.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  # ── Detect Changes ─────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Detect changed paths
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'templates/**'
              - 'action.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'biome.json'
              - 'tsconfig*.json'
              - '.npmrc'
              - 'docker-compose.yml'
              - '.dockerignore'
              - 'render.yaml'
              - '.github/workflows/**'
              - '.github/actions/**'

  # ── Security Scanning (advisory) ───────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup
        uses: ./.github/actions/setup
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  # ── Typecheck & Build ──────────────────────────────────────
  check:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup
        uses: ./.github/actions/setup
      - name: Typecheck all packages
        run: pnpm exec turbo typecheck
      - name: Build all packages
        run: pnpm exec turbo build

  # ── Lint ───────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint

  # ── Tests (PR: fast, no coverage) ──────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run tests
        run: pnpm exec turbo test
        env:
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

  # ── Tests + Coverage (main push / manual only) ─────────────
  coverage:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run tests with coverage
        run: pnpm exec turbo test:coverage
        env:
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
            apps/*/coverage/
          retention-days: 7
          if-no-files-found: ignore
