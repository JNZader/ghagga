# Manual republish of any package version that is in the checkout and missing
# on npm (for example a release that published ghagga but not ghagga-db).
#
# This workflow used to run on `release: published` as well. Release creation
# now happens in release.yml after publish, so a release trigger would publish
# a second time. workflow_dispatch is the only entry point left.
#
# Versions the registry already has are skipped. A publish that pnpm reports
# as successful still has to show up on the registry or the job fails.

name: Publish to npm

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Publish missing package versions
        run: bash scripts/publish-npm.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
