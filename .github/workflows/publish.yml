name: Publish to npm

on:
  release:
    types: [published]
  # Manual re-run (e.g. to publish a newly-added package that a prior release
  # missed). Every publish step is idempotent — already-published versions skip.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo build

      - run: pnpm turbo test

      # Publish in dependency order: db → core → forge → cli → triage-engine.
      # pnpm publish resolves workspace:^ → ^2.0.0 automatically.
      # Each step is IDEMPOTENT — if the exact name@version is already on npm it
      # is skipped, so a re-run (workflow_dispatch) that adds a missed package
      # never fails on the already-published ones.
      - name: Publish ghagga-db
        run: |
          PKG=$(node -p "require('./package.json').name"); VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then echo "$PKG@$VER already published — skipping"; else pnpm publish --access public --no-git-checks --provenance; fi
        working-directory: packages/db
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Publish ghagga-core
        run: |
          PKG=$(node -p "require('./package.json').name"); VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then echo "$PKG@$VER already published — skipping"; else pnpm publish --access public --no-git-checks --provenance; fi
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Publish ghagga-forge
        run: |
          PKG=$(node -p "require('./package.json').name"); VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then echo "$PKG@$VER already published — skipping"; else pnpm publish --access public --no-git-checks --provenance; fi
        working-directory: packages/forge
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Publish ghagga (CLI)
        run: |
          PKG=$(node -p "require('./package.json').name"); VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then echo "$PKG@$VER already published — skipping"; else pnpm publish --access public --no-git-checks --provenance; fi
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Publish ghagga-triage-engine
        run: |
          PKG=$(node -p "require('./package.json').name"); VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then echo "$PKG@$VER already published — skipping"; else pnpm publish --access public --no-git-checks --provenance; fi
        working-directory: packages/triage-engine
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
