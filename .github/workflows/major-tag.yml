# When a stable release is published by someone (a real release event), move
# the floating major tag vN to that commit so `JNZader/ghagga@vN` tracks the
# latest patch of the line.
#
# Tags are accepted with or without a leading v (v3.7.0 and 3.7.0). The
# floating tag is always vN. Prereleases and other names are left unchanged.
#
# release.yml also moves vN. A GitHub Release created with the default
# GITHUB_TOKEN does not trigger this workflow, so the Release job does the
# move itself. This workflow still covers a release published by a person.
# workflow_dispatch can repair a tag after the fact (input: v3.7.0 or 3.7.0).

name: Update major version tag

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to move vN onto (vX.Y.Z or X.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  major-tag:
    name: Move vX tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Check out the default branch, not the release tag. The tag being
      # moved may predate this script; the script then fetches the tag.
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Move floating major tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: bash scripts/move-major-tag.sh "$RELEASE_TAG" --push
