# ============================================
# Dependabot — Automated dependency updates
# ============================================
# Checks for outdated/vulnerable deps weekly.
# Groups minor+patch together to reduce PR noise.

version: 2

updates:
  # ── npm (pnpm) dependencies ────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 5
    # Supply-chain cooldown: hold a new version a few days before proposing it,
    # so a just-published compromised release isn't pulled in immediately.
    cooldown:
      default-days: 5
    reviewers:
      - "JNZader"
    labels:
      - "dependencies"
    groups:
      # Lockstep families FIRST (incl. majors): coupled packages update together
      # in ONE PR so a partial major bump can't break typecheck. This is the
      # AI-SDK coupled-majors scar (#289: `ai` v6→v7 + `@ai-sdk/*` landed as
      # SEPARATE major PRs). A dep lands in the first group it matches, so these
      # precede the minor-and-patch catch-all.
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      # Everything else: minor+patch batched into one PR; other majors get
      # individual PRs (breaking changes).
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Ignore packages that cause issues or are pinned intentionally
    ignore:
      - dependency-name: "@types/*"
        update-types: ["version-update:semver-patch"]

  # ── GitHub Actions ─────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 3
    reviewers:
      - "JNZader"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
