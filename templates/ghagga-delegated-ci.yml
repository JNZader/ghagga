# =============================================================================
# GHAGGA Delegated CI Runner
# =============================================================================
# This workflow executes CI jobs (lint, test) on behalf of the GHAGGA AI Code
# Review service. It is triggered via workflow_dispatch from the GHAGGA server
# and posts results back via a callback URL with HMAC-SHA256 signatures.
#
# SECURITY: This repo is public to leverage free GitHub Actions minutes.
# All tool output is captured to files only — NEVER printed to logs.
# Logs are auto-deleted after each run. Retention is set to 1 day as safety net.
#
# SUPPORTED PROFILES:
#   node-lint      — npm run lint (timeout: 10min)
#   node-unit      — npm test (timeout: 15min)
#   python-lint    — ruff check . (timeout: 10min)
#   python-pytest  — python -m pytest --tb=short -q (timeout: 15min)
#   go-test        — go test ./... (timeout: 15min)
#
# INPUT PACKING STRATEGY:
#   Security-critical inputs are separate workflow_dispatch inputs.
#   CI-specific inputs are packed into a single JSON 'config' input,
#   parsed via jq in a step (NOT fromJSON at workflow level).
# =============================================================================

name: GHAGGA Delegated CI

on:
  workflow_dispatch:
    inputs:
      callbackId:
        description: 'Unique correlation ID (UUID v4)'
        required: true
        type: string
      callbackUrl:
        description: 'Server URL to POST results to'
        required: true
        type: string
      callbackSecret:
        description: 'HMAC secret for computing callback signatures'
        required: true
        type: string
      repoFullName:
        description: 'Target repository (e.g., "user/repo")'
        required: true
        type: string
      headSha:
        description: 'HEAD commit SHA to checkout'
        required: true
        type: string
      baseBranch:
        description: 'Base branch name'
        required: true
        type: string
      config:
        description: 'JSON: { jobKey, profile, allowArtifacts, allowCache, maxDurationMinutes, prNumber }'
        required: true
        type: string

# Cancel in-progress runs for the same callback (safety net)
concurrency:
  group: ghagga-ci-${{ github.event.inputs.callbackId }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  delegated-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── Mask sensitive values ─────────────────────────────────
      - name: Mask sensitive data
        run: |
          echo "::add-mask::${{ secrets.GHAGGA_TOKEN }}"
          echo "::add-mask::${{ github.event.inputs.repoFullName }}"
          echo "::add-mask::${{ github.event.inputs.callbackSecret }}"
          REPO_NAME=$(echo "${{ github.event.inputs.repoFullName }}" | cut -d'/' -f2)
          echo "::add-mask::${REPO_NAME}"
          echo "::add-mask::$(pwd)/target-repo"

      # ── Parse config JSON ─────────────────────────────────────
      - name: Parse config
        id: config
        run: |
          CONFIG='${{ github.event.inputs.config }}'
          echo "jobKey=$(echo "$CONFIG" | jq -r '.jobKey')" >> "$GITHUB_OUTPUT"
          echo "profile=$(echo "$CONFIG" | jq -r '.profile')" >> "$GITHUB_OUTPUT"
          echo "allowArtifacts=$(echo "$CONFIG" | jq -c '.allowArtifacts // false')" >> "$GITHUB_OUTPUT"
          echo "allowCache=$(echo "$CONFIG" | jq -r '.allowCache // false')" >> "$GITHUB_OUTPUT"
          echo "maxDurationMinutes=$(echo "$CONFIG" | jq -r '.maxDurationMinutes // 15')" >> "$GITHUB_OUTPUT"
          echo "prNumber=$(echo "$CONFIG" | jq -r '.prNumber // 0')" >> "$GITHUB_OUTPUT"

      # ── Validate profile ──────────────────────────────────────
      - name: Validate profile
        id: validate
        run: |
          PROFILE="${{ steps.config.outputs.profile }}"
          case "$PROFILE" in
            node-lint|node-unit|python-lint|python-pytest|go-test)
              echo "valid=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "valid=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # ── Handle invalid profile (send failed callback) ─────────
      - name: Report invalid profile
        if: steps.validate.outputs.valid == 'false'
        run: |
          PAYLOAD=$(jq -n \
            --arg cid "${{ github.event.inputs.callbackId }}" \
            --arg repo "${{ github.event.inputs.repoFullName }}" \
            --arg jk "${{ steps.config.outputs.jobKey }}" \
            --arg profile "${{ steps.config.outputs.profile }}" \
            '{
              executionKind: "delegated-ci",
              callbackId: $cid,
              repoFullName: $repo,
              jobKey: $jk,
              state: "failed",
              startedAt: null,
              completedAt: null,
              durationMs: 0,
              summary: null,
              outcome: null,
              artifacts: [],
              errorCode: "invalid_profile",
              errorMessage: ("Unsupported CI profile: " + $profile)
            }')
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ github.event.inputs.callbackSecret }}" | awk '{print $NF}')
          curl -s -X POST "${{ github.event.inputs.callbackUrl }}" \
            -H "Content-Type: application/json" \
            -H "X-Ghagga-Signature: sha256=${SIGNATURE}" \
            -d "$PAYLOAD" 2>/dev/null || true
          exit 0

      # ── Clone target repository ───────────────────────────────
      - name: Clone target repository
        if: steps.validate.outputs.valid == 'true'
        uses: actions/checkout@v4
        id: clone
        continue-on-error: true
        with:
          repository: ${{ github.event.inputs.repoFullName }}
          ref: ${{ github.event.inputs.headSha }}
          token: ${{ secrets.GHAGGA_TOKEN }}
          path: target-repo

      # ── Handle clone failure (send failed callback) ───────────
      - name: Report clone failure
        if: steps.validate.outputs.valid == 'true' && steps.clone.outcome == 'failure'
        run: |
          PAYLOAD=$(jq -n \
            --arg cid "${{ github.event.inputs.callbackId }}" \
            --arg repo "${{ github.event.inputs.repoFullName }}" \
            --arg jk "${{ steps.config.outputs.jobKey }}" \
            '{
              executionKind: "delegated-ci",
              callbackId: $cid,
              repoFullName: $repo,
              jobKey: $jk,
              state: "failed",
              startedAt: null,
              completedAt: null,
              durationMs: 0,
              summary: null,
              outcome: null,
              artifacts: [],
              errorCode: "clone_failed",
              errorMessage: "Repository checkout failed (token may have expired)"
            }')
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ github.event.inputs.callbackSecret }}" | awk '{print $NF}')
          curl -s -X POST "${{ github.event.inputs.callbackUrl }}" \
            -H "Content-Type: application/json" \
            -H "X-Ghagga-Signature: sha256=${SIGNATURE}" \
            -d "$PAYLOAD" 2>/dev/null || true
          exit 0

      # ── Send "running" callback ───────────────────────────────
      - name: Report running state
        if: steps.validate.outputs.valid == 'true' && steps.clone.outcome == 'success'
        run: |
          START_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "START_TIME=$START_TIME" >> "$GITHUB_ENV"
          PAYLOAD=$(jq -n \
            --arg cid "${{ github.event.inputs.callbackId }}" \
            --arg repo "${{ github.event.inputs.repoFullName }}" \
            --arg jk "${{ steps.config.outputs.jobKey }}" \
            --arg started "$START_TIME" \
            '{
              executionKind: "delegated-ci",
              callbackId: $cid,
              repoFullName: $repo,
              jobKey: $jk,
              state: "running",
              startedAt: $started,
              completedAt: null,
              durationMs: 0,
              summary: null,
              outcome: null,
              artifacts: [],
              errorCode: null,
              errorMessage: null
            }')
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ github.event.inputs.callbackSecret }}" | awk '{print $NF}')
          curl -s -X POST "${{ github.event.inputs.callbackUrl }}" \
            -H "Content-Type: application/json" \
            -H "X-Ghagga-Signature: sha256=${SIGNATURE}" \
            -d "$PAYLOAD" 2>/dev/null || true

      # ── Setup runtime: Node.js ────────────────────────────────
      - name: Setup Node.js
        if: steps.clone.outcome == 'success' && (steps.config.outputs.profile == 'node-lint' || steps.config.outputs.profile == 'node-unit')
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Setup runtime: Python ─────────────────────────────────
      - name: Setup Python
        if: steps.clone.outcome == 'success' && (steps.config.outputs.profile == 'python-lint' || steps.config.outputs.profile == 'python-pytest')
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Setup runtime: Go ─────────────────────────────────────
      - name: Setup Go
        if: steps.clone.outcome == 'success' && steps.config.outputs.profile == 'go-test'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # ── Install dependencies (suppress all output) ────────────
      - name: Install dependencies
        if: steps.clone.outcome == 'success'
        id: install
        continue-on-error: true
        working-directory: target-repo
        run: |
          set +e
          PROFILE="${{ steps.config.outputs.profile }}"
          case "$PROFILE" in
            node-lint|node-unit)
              if [ -f "pnpm-lock.yaml" ]; then
                npm install -g pnpm 2>/dev/null && pnpm install --frozen-lockfile > /dev/null 2>&1
              elif [ -f "yarn.lock" ]; then
                yarn install --frozen-lockfile > /dev/null 2>&1
              elif [ -f "package-lock.json" ]; then
                npm ci > /dev/null 2>&1
              else
                npm install > /dev/null 2>&1
              fi
              ;;
            python-lint)
              pip install --quiet ruff 2>/dev/null
              ;;
            python-pytest)
              if [ -f "requirements.txt" ]; then pip install --quiet -r requirements.txt 2>/dev/null; fi
              if [ -f "requirements-dev.txt" ]; then pip install --quiet -r requirements-dev.txt 2>/dev/null; fi
              if [ -f "pyproject.toml" ]; then pip install --quiet -e ".[dev]" 2>/dev/null || pip install --quiet -e ".[test]" 2>/dev/null || pip install --quiet -e . 2>/dev/null; fi
              pip install --quiet pytest 2>/dev/null
              ;;
            go-test)
              go mod download 2>/dev/null
              ;;
          esac
          INSTALL_EXIT=$?
          if [ $INSTALL_EXIT -ne 0 ]; then
            exit 1
          fi

      # ── Execute CI profile command (output to files only) ─────
      - name: Execute CI job
        if: steps.clone.outcome == 'success' && steps.install.outcome == 'success'
        id: execute
        continue-on-error: true
        working-directory: target-repo
        run: |
          START_MS=$(($(date +%s%N)/1000000))
          set +e
          PROFILE="${{ steps.config.outputs.profile }}"
          MAX_DURATION="${{ steps.config.outputs.maxDurationMinutes }}"
          TIMEOUT_SECS=$((${MAX_DURATION:-15} * 60))

          case "$PROFILE" in
            node-lint)
              timeout "$TIMEOUT_SECS" npm run lint > /tmp/ci-stdout.txt 2> /tmp/ci-stderr.txt
              ;;
            node-unit)
              timeout "$TIMEOUT_SECS" npm test > /tmp/ci-stdout.txt 2> /tmp/ci-stderr.txt
              ;;
            python-lint)
              timeout "$TIMEOUT_SECS" ruff check . > /tmp/ci-stdout.txt 2> /tmp/ci-stderr.txt
              ;;
            python-pytest)
              timeout "$TIMEOUT_SECS" python -m pytest --tb=short -q > /tmp/ci-stdout.txt 2> /tmp/ci-stderr.txt
              ;;
            go-test)
              timeout "$TIMEOUT_SECS" go test ./... > /tmp/ci-stdout.txt 2> /tmp/ci-stderr.txt
              ;;
          esac
          EXIT_CODE=$?
          END_MS=$(($(date +%s%N)/1000000))
          DURATION=$((END_MS - START_MS))

          echo "exitCode=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "durationMs=$DURATION" >> "$GITHUB_OUTPUT"

          # Detect timeout (exit code 124 from GNU timeout)
          if [ $EXIT_CODE -eq 124 ]; then
            echo "timedOut=true" >> "$GITHUB_OUTPUT"
          else
            echo "timedOut=false" >> "$GITHUB_OUTPUT"
          fi

          # Extract a short summary from output (first 5 lines, max 500 chars)
          SUMMARY=$(head -5 /tmp/ci-stdout.txt 2>/dev/null | head -c 500 || echo "No output captured")
          echo "$SUMMARY" > /tmp/ci-summary.txt

      # ── Send final callback ───────────────────────────────────
      - name: Post final callback
        if: steps.validate.outputs.valid == 'true' && steps.clone.outcome == 'success'
        run: |
          COMPLETED_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          if [ "${{ steps.install.outcome }}" = "failure" ]; then
            STATE="failed"
            OUTCOME="failure"
            ERROR_CODE="install_failed"
            ERROR_MSG="Dependency installation failed"
            DURATION_MS=0
            SUMMARY="Dependency installation failed"
          elif [ "${{ steps.execute.outputs.timedOut }}" = "true" ]; then
            STATE="failed"
            OUTCOME="failure"
            ERROR_CODE="timeout"
            ERROR_MSG="CI job exceeded maximum duration of ${{ steps.config.outputs.maxDurationMinutes }} minutes"
            DURATION_MS="${{ steps.execute.outputs.durationMs }}"
            SUMMARY="Job timed out"
          elif [ "${{ steps.execute.outputs.exitCode }}" != "0" ]; then
            STATE="completed"
            OUTCOME="failure"
            ERROR_CODE=""
            ERROR_MSG=""
            DURATION_MS="${{ steps.execute.outputs.durationMs }}"
            SUMMARY=$(cat /tmp/ci-summary.txt 2>/dev/null || echo "Job failed")
          else
            STATE="completed"
            OUTCOME="success"
            ERROR_CODE=""
            ERROR_MSG=""
            DURATION_MS="${{ steps.execute.outputs.durationMs }}"
            SUMMARY=$(cat /tmp/ci-summary.txt 2>/dev/null || echo "Job completed successfully")
          fi

          # Build payload with jq for safe JSON escaping
          PAYLOAD=$(jq -n \
            --arg cid "${{ github.event.inputs.callbackId }}" \
            --arg repo "${{ github.event.inputs.repoFullName }}" \
            --arg jk "${{ steps.config.outputs.jobKey }}" \
            --arg state "$STATE" \
            --arg started "${START_TIME:-}" \
            --arg completed "$COMPLETED_TIME" \
            --arg duration "${DURATION_MS:-0}" \
            --arg summary "$SUMMARY" \
            --arg outcome "$OUTCOME" \
            --arg errCode "$ERROR_CODE" \
            --arg errMsg "$ERROR_MSG" \
            '{
              executionKind: "delegated-ci",
              callbackId: $cid,
              repoFullName: $repo,
              jobKey: $jk,
              state: $state,
              startedAt: (if $started != "" then $started else null end),
              completedAt: $completed,
              durationMs: ($duration | tonumber),
              summary: $summary,
              outcome: $outcome,
              artifacts: [],
              errorCode: (if $errCode != "" then $errCode else null end),
              errorMessage: (if $errMsg != "" then $errMsg else null end)
            }')

          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ github.event.inputs.callbackSecret }}" | awk '{print $NF}')
          curl -s -X POST "${{ github.event.inputs.callbackUrl }}" \
            -H "Content-Type: application/json" \
            -H "X-Ghagga-Signature: sha256=${SIGNATURE}" \
            -d "$PAYLOAD" 2>/dev/null || echo "::warning::Final callback POST failed"

      # ── Delete workflow logs ──────────────────────────────────
      - name: Delete workflow logs
        if: always()
        run: |
          sleep 5
          curl -s -X DELETE \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/logs" \
            -H "Authorization: Bearer ${{ secrets.GHAGGA_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            2>/dev/null || echo "::warning::Log deletion failed (will auto-purge in 1 day)"

      # ── Cleanup cloned repo and temp files ────────────────────
      - name: Cleanup
        if: always()
        run: rm -rf target-repo /tmp/ci-*.txt
