# =============================================================================
# GHAGGA Semgrep: Universal Security & Quality Rules
# =============================================================================
# Multi-language rules for: Java, Kotlin, JS, TS, Python, Go, Rust
# =============================================================================

rules:
  # ===== SECRETS =====
  # Precision note: a bare `$VAR = "..."` matches almost every string-constant
  # assignment, which floods results with false positives. This rule only fires
  # when EITHER (a) the assigned name/key looks secret-ish (keyword regex) OR
  # (b) the literal value matches a known high-signal secret shape (provider
  # prefixes, JWT, or a long base64/hex blob). Both name and value are captured
  # so the two conditions can be OR'd via pattern-either.
  - id: hardcoded-secret-generic
    # Each pattern-either branch re-includes the base assignment pattern so the
    # metavariable ($VAR / $VAL) is bound in the same scope as its regex filter.
    # NOTE: the JSON-object-key form (`"key": "value"`) was intentionally dropped
    # from this multi-language rule because it is not parseable as a pattern in
    # java/kotlin/python/go/rust and a single parse failure disables the whole
    # rule. The cross-language assignment form (`$VAR = "$VAL"`) is what survives
    # everywhere and carries the signal.
    pattern-either:
      # (a) variable/key NAME looks like a secret
      - patterns:
          - pattern: $VAR = "$VAL"
          - metavariable-regex:
              metavariable: $VAR
              regex: (?i)(secret|token|api[_-]?key|apikey|password|passwd|pwd|credential|auth[_-]?token|private[_-]?key|access[_-]?key|client[_-]?secret)
      # (b) string VALUE matches a known high-signal secret shape.
      # High-signal provider prefixes ONLY. The generic base64/hex {32,}
      # alternates were REMOVED (2026-06-15, 3vr): they matched any
      # UUID/SHA/cache-key/blob → massive FPs. Real secrets are still caught
      # here by prefix, or by the secret-keyword var-name branch (a).
      - patterns:
          - pattern: $VAR = "$VAL"
          - metavariable-regex:
              metavariable: $VAL
              regex: (AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9-]{20,}|ghp_[A-Za-z0-9]{36}|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)
    message: "Possible hardcoded secret. Use environment variables."
    severity: ERROR
    languages: [java, kotlin, javascript, typescript, python, go, rust]

  # ===== SQL INJECTION =====
  - id: sql-string-concat
    pattern-either:
      - pattern: |
          "SELECT " + $USER_INPUT
      - pattern: |
          "DELETE " + $USER_INPUT
      - pattern: |
          "UPDATE " + $USER_INPUT
      - pattern: |
          "INSERT " + $USER_INPUT
      - pattern: |
          f"SELECT {$USER_INPUT}"
      - pattern: |
          `SELECT ${$USER_INPUT}`
    message: "SQL injection risk: use parameterized queries"
    severity: ERROR
    languages: [java, kotlin, javascript, typescript, python]

  # ===== JAVA/KOTLIN =====
  - id: java-unsafe-reflection
    pattern: Class.forName($USER_INPUT)
    message: "Unsafe reflection with user input"
    severity: WARNING
    languages: [java, kotlin]

  # ===== JAVASCRIPT/TYPESCRIPT =====
  - id: js-eval-usage
    pattern-either:
      - pattern: eval($X)
      - pattern: new Function($X)
    message: "Avoid eval() - security risk"
    severity: ERROR
    languages: [javascript, typescript]

  - id: js-innerhtml
    pattern: $X.innerHTML = $Y
    message: "innerHTML can cause XSS. Use textContent or sanitize."
    severity: WARNING
    languages: [javascript, typescript]

  # ===== PYTHON =====
  - id: python-exec
    pattern-either:
      - pattern: exec($X)
      - pattern: eval($X)
    message: "Avoid exec/eval - security risk"
    severity: ERROR
    languages: [python]

  - id: python-subprocess-shell
    pattern: subprocess.$FUNC(..., shell=True, ...)
    message: "shell=True is dangerous with user input"
    severity: WARNING
    languages: [python]

  # ===== GO =====
  - id: go-sql-format
    pattern: |
      fmt.Sprintf("SELECT ... %s ...", $USER_INPUT)
    message: "SQL injection risk: use parameterized queries"
    severity: ERROR
    languages: [go]

  # ===== RUST =====
  - id: rust-unsafe-block
    pattern: |
      unsafe { ... }
    message: "Review unsafe block carefully"
    severity: INFO
    languages: [rust]

  # ===== SKIPPED TESTS =====
  - id: test-todo-skip
    pattern-either:
      - pattern: "@Disabled"
      - pattern: "@Ignore"
      - pattern: "it.skip(...)"
      - pattern: "describe.skip(...)"
      - pattern: "@pytest.mark.skip"
      - pattern: "t.Skip()"
    message: "Skipped test - ensure it's intentional"
    severity: INFO
    languages: [java, kotlin, javascript, typescript, python, go]

  # ===== PATH TRAVERSAL =====
  - id: path-traversal-node
    pattern-either:
      - pattern: path.join(..., $USER_INPUT, ...)
      - pattern: fs.readFile($USER_INPUT, ...)
      - pattern: fs.readFileSync($USER_INPUT, ...)
    message: "Potential path traversal - validate user input"
    severity: WARNING
    languages: [javascript, typescript]

  - id: path-traversal-python
    pattern-either:
      - pattern: open($USER_INPUT, ...)
      - pattern: os.path.join(..., $USER_INPUT, ...)
    message: "Potential path traversal - validate user input"
    severity: WARNING
    languages: [python]

  - id: path-traversal-go
    pattern: filepath.Join(..., $USER_INPUT, ...)
    message: "Potential path traversal - validate user input"
    severity: WARNING
    languages: [go]

  # ===== COMMAND INJECTION =====
  # Precision tradeoff: we catch the literal `child_process.exec(...)` member
  # call AND the destructured / aliased forms, but the bare `exec(...)` and the
  # aliased `cp.exec(...)` branches are scoped with `pattern-inside` to a file
  # that actually imports/requires `child_process` (or `node:child_process`).
  # This avoids flagging unrelated `.exec()` calls (RegExp.exec, Mongoose
  # query.exec) while still catching the realistic forms:
  #   import { exec } from 'node:child_process'; exec(userInput)
  #   import cp from 'child_process';            cp.exec(userInput)
  #   const cp = require('child_process');       cp.exec(userInput)
  #   const { exec } = require('child_process');  exec(userInput)
  # Accepted residual risk: a bare `exec(userInput)` in a file that imports
  # child_process but where `exec` is actually a DIFFERENT local function would
  # be a false positive. This is rare and the security upside outweighs it.
  - id: command-injection-node
    pattern-either:
      # Direct member call on the child_process namespace.
      - pattern: child_process.exec($USER_INPUT, ...)
      - pattern: child_process.execSync($USER_INPUT, ...)
      # Named import: `import { exec } from 'child_process'` -> bare exec(...).
      - patterns:
          - pattern-either:
              - pattern: exec($USER_INPUT, ...)
              - pattern: execSync($USER_INPUT, ...)
          - pattern-inside: |
              import { ..., exec, ... } from "child_process"
              ...
      - patterns:
          - pattern-either:
              - pattern: exec($USER_INPUT, ...)
              - pattern: execSync($USER_INPUT, ...)
          - pattern-inside: |
              import { ..., exec, ... } from "node:child_process"
              ...
      - patterns:
          - pattern-either:
              - pattern: exec($USER_INPUT, ...)
              - pattern: execSync($USER_INPUT, ...)
          - pattern-inside: |
              import { ..., execSync, ... } from "child_process"
              ...
      - patterns:
          - pattern-either:
              - pattern: exec($USER_INPUT, ...)
              - pattern: execSync($USER_INPUT, ...)
          - pattern-inside: |
              import { ..., execSync, ... } from "node:child_process"
              ...
      # Default / namespace import: `import cp from 'child_process'` -> cp.exec().
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($USER_INPUT, ...)
              - pattern: $CP.execSync($USER_INPUT, ...)
          - pattern-inside: |
              import $CP from "child_process"
              ...
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($USER_INPUT, ...)
              - pattern: $CP.execSync($USER_INPUT, ...)
          - pattern-inside: |
              import $CP from "node:child_process"
              ...
      # require namespace: `const cp = require('child_process')` -> cp.exec().
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($USER_INPUT, ...)
              - pattern: $CP.execSync($USER_INPUT, ...)
          - pattern-inside: |
              $CP = require("child_process")
              ...
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($USER_INPUT, ...)
              - pattern: $CP.execSync($USER_INPUT, ...)
          - pattern-inside: |
              $CP = require("node:child_process")
              ...
    message: "Potential command injection - use execFile instead"
    severity: ERROR
    languages: [javascript, typescript]

  - id: command-injection-go
    pattern-either:
      - pattern: exec.Command($USER_INPUT, ...)
      - pattern: exec.CommandContext(..., $USER_INPUT, ...)
    message: "Potential command injection - sanitize user input"
    severity: ERROR
    languages: [go]

  # ===== SSRF =====
  - id: ssrf-node
    pattern-either:
      - pattern: fetch($USER_INPUT, ...)
      - pattern: axios.get($USER_INPUT, ...)
    message: "Potential SSRF - validate URL against allowlist"
    severity: WARNING
    languages: [javascript, typescript]

  - id: ssrf-python
    pattern-either:
      - pattern: requests.get($USER_INPUT, ...)
      - pattern: urllib.request.urlopen($USER_INPUT)
    message: "Potential SSRF - validate URL against allowlist"
    severity: WARNING
    languages: [python]

  # ===== INSECURE DESERIALIZATION =====
  - id: insecure-deserialize-python
    pattern-either:
      - pattern: pickle.loads($X)
      - pattern: yaml.load($X)
      - pattern: yaml.unsafe_load($X)
    message: "Insecure deserialization - use safe alternatives"
    severity: ERROR
    languages: [python]

  - id: insecure-deserialize-java
    pattern: new ObjectInputStream($X)
    message: "Insecure deserialization - validate input source"
    severity: WARNING
    languages: [java, kotlin]

  # ===== LOG INJECTION =====
  - id: log-injection
    pattern-either:
      - pattern: logger.info($USER_INPUT)
      - pattern: console.log($USER_INPUT)
      - pattern: log.Printf($USER_INPUT)
    message: "Log injection risk - sanitize user input before logging"
    severity: INFO
    languages: [java, javascript, typescript, go, python]

  # ===== WEAK CRYPTOGRAPHY =====
  - id: weak-crypto-md5
    pattern-either:
      - pattern: MessageDigest.getInstance("MD5")
      - pattern: hashlib.md5(...)
      - pattern: crypto.createHash("md5")
      - pattern: md5.New()
    message: "MD5 is weak - use SHA-256 or better"
    severity: WARNING
    languages: [java, python, javascript, typescript, go]

  - id: weak-crypto-sha1
    pattern-either:
      - pattern: MessageDigest.getInstance("SHA-1")
      - pattern: hashlib.sha1(...)
      - pattern: crypto.createHash("sha1")
      - pattern: sha1.New()
    message: "SHA-1 is weak for security - use SHA-256 or better"
    severity: WARNING
    languages: [java, python, javascript, typescript, go]
