# =============================================================================
# GHAGGA bundled Gitleaks configuration
# =============================================================================
# Extends the gitleaks built-in default ruleset and adds a conservative
# path-based allowlist for test files / fixtures.
#
# Tradeoff (accepted by maintainer): this reduces noise from fake tokens in
# test fixtures at the cost of potentially missing a REAL secret that is
# hardcoded inside a test/fixture file. Production source is unaffected.
#
# NOTE: pinned gitleaks version is 8.21.2 (< 8.25.0), which uses the singular
# `[allowlist]` table with `paths = [...]` regexes. Do NOT switch to the
# `[[allowlists]]` array form unless the pinned version is bumped to >= 8.25.0.
# =============================================================================

title = "GHAGGA Gitleaks configuration"

[extend]
# Keep all of gitleaks' built-in default rules.
useDefault = true

[allowlist]
description = "Ignore secrets found in test files and fixtures (conservative)"
# Go (RE2) regexes matched against the file path. A finding whose path matches
# ANY of these is suppressed.
paths = [
  '''.*\.test\.[tj]sx?$''',
  '''.*\.spec\.[tj]sx?$''',
  '''.*_test\.(py|go)$''',
  '''.*test_.*\.py$''',
  '''.*/__tests__/.*''',
  '''.*/tests?/.*''',
  '''.*/fixtures?/.*''',
  '''.*/testdata/.*''',
  # Generated GitHub Action bundle (ncc output). Committed so the Action can run
  # without a build step, but it inlines third-party deps that ship fake/example
  # credentials (e.g. JSDoc samples, the public Azure devstorage emulator key).
  # Not human-authored source — never a place a real secret should originate.
  '''apps/action/dist/.*''',
]

# Specific placeholder/example secret values that appear in documentation and CI.
# These are NOT real credentials: they are deterministic dummies or truncated
# samples used to illustrate env-var setup. Matched against the secret value so
# a genuine secret in the same file would still be flagged.
regexes = [
  # Deterministic all-hex dummy ENCRYPTION_KEY used in CI test env + setup docs
  # (.github/workflows/ci.yml, CONTRIBUTING.md).
  '''0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''',
  # a1b2c3... placeholder secrets in docs/self-hosted.md examples — both the
  # full repeated ENCRYPTION_KEY/STATE_SECRET form and the truncated
  # "a1b2c3d4e5f6..." webhook-secret sample.
  '''(?:a1b2c3d4e5f6)+(?:\.\.\.)?''',
  # Truncated/ellipsis example secrets in docs (e.g. "LS0tLS1...", "Ov23li...",
  # "MIIEpAIBAAKCAQEA...") and Spanish placeholder text in deploy guides.
  '''(?:LS0tLS1CRUdJTi|Ov23li|MIIEpAIBAAKCAQEA)\.\.\.''',
  '''los_64_caracteres_hex_aqui''',
]
