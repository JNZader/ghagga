# =============================================================================
# LEGACY: Northflank Service Configuration -- GHAGGA Server
# =============================================================================
# NOTE: GHAGGA has migrated to self-hosted deployment via Coolify on Hetzner.
# This file is kept for reference only. The recommended deployment method is
# documented in docs/deployment.md.
#
# If you still want to deploy on Northflank, you will also need a Redis
# add-on or external Redis instance for BullMQ job processing.
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: ghagga-server
  description: GHAGGA AI Code Review Server
spec:
  type: external-image
  image:
    dockerfile: apps/server/Dockerfile
    registry: auto-build
    
  runtime:
    command: []
    args: []
    environment:
      - name: PORT
        value: "3000"
      - name: NODE_ENV
        value: "production"
    # Sensitive variables (set in dashboard or via CLI):
    # - DATABASE_URL
    # - REDIS_URL
    # - GITHUB_APP_ID
    # - GITHUB_PRIVATE_KEY
    # - GITHUB_WEBHOOK_SECRET
    # - ENCRYPTION_KEY
    # - STATE_SECRET
    # - GITHUB_CLIENT_SECRET
    # - WORKER_CONCURRENCY (optional, default: 3)
    
  networking:
    ports:
      - port: 3000
        protocol: http
        public: true
    domain: auto
    
  resources:
    compute:
      cpu: 100m
      memory: 512Mi
      
  scaling:
    min: 1
    max: 1
    
  healthCheck:
    enabled: true
    path: /health
    port: 3000
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
    
  # Auto-deploy from GitHub
  build:
    type: github
    repo: JNZader/ghagga
    branch: main
    trigger: automatic
